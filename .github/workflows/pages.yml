name: Snabb kontroll och publicering
# Varje push (beslut 84.6): innehållskontrollen, enhetstesterna, bygget och röktestet i varje profil, och
# textkapas när text eller layout har ändrats. Publiceras inom ca 10–15 minuter.
# Hela webbsviten i hela matrisen är "Stora kontrollen" (stora.yml): när den vuxne ska spela, och varje natt.
# Namnkontrollen körs före push på datorn som pushar (verktyg/git-krokar/pre-push).
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  andrat:
    # Har text eller layout ändrats sedan förra pushen? Då körs textkapas.
    runs-on: ubuntu-24.04
    outputs:
      text: ${{ steps.diff.outputs.text }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          FORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$FORE" ] || ! git cat-file -e "$FORE^{commit}" 2>/dev/null; then
            echo "text=ja" >> "$GITHUB_OUTPUT"; echo "ingen jämförelse: textkapas körs"; exit 0
          fi
          git diff --name-only "$FORE" "$GITHUB_SHA" | tee filer.txt
          if grep -qE -f verktyg/test/textkapas-filer.txt filer.txt; then echo "text=ja" >> "$GITHUB_OUTPUT"; else echo "text=nej" >> "$GITHUB_OUTPUT"; fi
  testa:
    needs: andrat
    runs-on: ubuntu-24.04
    # Playwrights egen bild med samma version som package.json: webbläsarna och deras systempaket finns redan.
    # Att installera dem i varje körning hängde flera gånger hos GitHub (apt och nedladdningen).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Innehållskontroll och enhetstester
        run: npm run kontroll
      - name: Bygg
        run: npm run build
      - name: Röktest i varje profil
        run: npm run test:rok
        env:
          CI: '1'
      - name: Textkapas (text eller layout har ändrats)
        if: needs.andrat.outputs.text == 'ja'
        run: npx playwright test textkapas --project=mac-helskarm
        env:
          CI: '1'
          PW_UT: test-results-textkapas
      - name: Spara skärmdumpar och testrapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testresultat
          path: |
            tests/skarmdumpar/
            playwright-report/
            test-results/
            test-results-textkapas/
            test-results-textkapas-rapport/
          retention-days: 14
      - name: Förbered publicering
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publicera:
    # Publiceras bara från main, och bara om röktestet gick igenom.
    if: github.ref == 'refs/heads/main'
    needs: testa
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.publicering.outputs.page_url }}
    steps:
      - id: publicering
        uses: actions/deploy-pages@v4
