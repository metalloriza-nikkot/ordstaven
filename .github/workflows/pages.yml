name: Testa och publicera
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  testa:
    runs-on: ubuntu-24.04 # inte ubuntu-latest: Playwrights --with-deps stöder inte Ubuntu 26 ännu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enhetstester
        run: npm run kontroll
      - name: Bygg
        run: npm run build
      - name: Installera testwebbläsare
        # nedladdningen kan hänga på GitHubs sida: högst 5 minuter per försök, tre försök
        timeout-minutes: 16
        run: |
          for i in 1 2 3; do
            timeout 300 npx playwright install --with-deps chromium webkit && exit 0
            echo "försök $i hängde eller misslyckades, provar igen"
          done
          exit 1
      - name: Webbläsartester (hela testmatrisen)
        run: npm run test:webb
        env:
          CI: '1'
      - name: Spara skärmdumpar och testrapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testresultat
          path: |
            tests/skarmdumpar/
            playwright-report/
            test-results/
          retention-days: 14
      - name: Förbered publicering
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publicera:
    # Publiceras bara från main, och bara om alla tester gick igenom.
    if: github.ref == 'refs/heads/main'
    needs: testa
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.publicering.outputs.page_url }}
    steps:
      - id: publicering
        uses: actions/deploy-pages@v4
